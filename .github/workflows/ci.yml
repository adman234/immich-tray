name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/ImmichTray.Tests -c Release

      - name: Publish (smoke)
        run: dotnet publish src/ImmichTray -c Release -o publish -p:Version=0.0.0-ci
